name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v1.0.0)'
        required: false
        default: ''

env:
  RELEASE_NAME: "CGame Racer ${{ github.ref_name }}"

jobs:
  # ============================================
  # Build all platforms
  # ============================================
  build-linux-x64:
    name: "Linux x64"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build
      - name: Build raylib
        run: |
          if [ ! -f raylib/src/libraylib.a ]; then
            cd raylib && make -j4 PLATFORM_OS=LINUX && cd ..
          fi
      - name: Build
        run: |
          cmake --preset linux-x64
          cmake --build --preset linux-x64
      - name: Package
        run: |
          mkdir -p release/linux-x64
          cp build/c-game-client-x64 release/linux-x64/
          cp build/c-game-server-x64 release/linux-x64/
          cp README.md release/linux-x64/ || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "linux-x64"
          path: release/linux-x64/
          retention-days: 7

  build-linux-x86:
    name: "Linux x86"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build gcc-multilib
      - name: Build raylib
        run: |
          if [ ! -f raylib/src/libraylib.a ]; then
            cd raylib && make -j4 PLATFORM_OS=LINUX && cd ..
          fi
      - name: Build
        run: |
          cmake --preset linux-x86
          cmake --build --preset linux-x86
      - name: Package
        run: |
          mkdir -p release/linux-x86
          cp build-linux-x86/c-game-client-x86 release/linux-x86/
          cp build-linux-x86/c-game-server-x86 release/linux-x86/
          cp README.md release/linux-x86/ || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "linux-x86"
          path: release/linux-x86/
          retention-days: 7

  build-linux-arm64:
    name: "Linux ARM64"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Build raylib
        run: |
          cd raylib && make -j4 CC=aarch64-linux-gnu-gcc AR=aarch64-linux-gnu-ar PLATFORM_OS=LINUX && cd ..
      - name: Build
        run: |
          cmake --preset linux-arm64 -DCGAME_SKIP_RAYLIB_BUILD=ON
          cmake --build --preset linux-arm64
      - name: Package
        run: |
          mkdir -p release/linux-arm64
          cp build-linux-arm64/c-game-client-arm64 release/linux-arm64/
          cp build-linux-arm64/c-game-server-arm64 release/linux-arm64/
          cp README.md release/linux-arm64/ || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "linux-arm64"
          path: release/linux-arm64/
          retention-days: 7

  build-linux-arm32:
    name: "Linux ARM32"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
      - name: Build raylib
        run: |
          cd raylib && make -j4 CC=arm-linux-gnueabihf-gcc AR=arm-linux-gnueabihf-ar PLATFORM_OS=LINUX && cd ..
      - name: Build
        run: |
          cmake --preset linux-arm32 -DCGAME_SKIP_RAYLIB_BUILD=ON
          cmake --build --preset linux-arm32
      - name: Package
        run: |
          mkdir -p release/linux-arm32
          cp build-linux-arm32/c-game-client-arm32 release/linux-arm32/
          cp build-linux-arm32/c-game-server-arm32 release/linux-arm32/
          cp README.md release/linux-arm32/ || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "linux-arm32"
          path: release/linux-arm32/
          retention-days: 7

  build-linux-riscv64:
    name: "Linux RISC-V 64"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
      - name: Build raylib
        run: |
          cd raylib && make -j4 CC=riscv64-linux-gnu-gcc AR=riscv64-linux-gnu-ar PLATFORM_OS=LINUX && cd ..
      - name: Build
        run: |
          cmake --preset linux-riscv64 -DCGAME_SKIP_RAYLIB_BUILD=ON
          cmake --build --preset linux-riscv64
      - name: Package
        run: |
          mkdir -p release/linux-riscv64
          cp build-linux-riscv64/c-game-client-riscv64 release/linux-riscv64/
          cp build-linux-riscv64/c-game-server-riscv64 release/linux-riscv64/
          cp README.md release/linux-riscv64/ || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "linux-riscv64"
          path: release/linux-riscv64/
          retention-days: 7

  build-linux-mips64:
    name: "Linux MIPS 64"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake gcc-mips64-linux-gnuabi64 g++-mips64-linux-gnuabi64
      - name: Build raylib
        run: |
          cd raylib && make -j4 CC=mips64-linux-gnuabi64-gcc AR=mips64-linux-gnuabi64-ar PLATFORM_OS=LINUX && cd ..
      - name: Build
        run: |
          cmake --preset linux-mips64 -DCGAME_SKIP_RAYLIB_BUILD=ON
          cmake --build --preset linux-mips64
      - name: Package
        run: |
          mkdir -p release/linux-mips64
          cp build-linux-mips64/c-game-client-mips64 release/linux-mips64/
          cp build-linux-mips64/c-game-server-mips64 release/linux-mips64/
          cp README.md release/linux-mips64/ || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "linux-mips64"
          path: release/linux-mips64/
          retention-days: 7

  build-windows-x64:
    name: "Windows x64"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install CMake
        uses: ilammy/setup-msbuild@v2
      - name: Build raylib
        shell: bash
        run: |
          if [ ! -f raylib/src/libraylib.a ]; then
            cd raylib/src && make -j4 PLATFORM_OS=WINDOWS && cd ../..
          fi
      - name: Build
        shell: bash
        run: |
          cmake -G Ninja ..
          cmake --build .
      - name: Package
        shell: bash
        run: |
          mkdir -p release/windows-x64
          cp c-game-client-x64.exe release/windows-x64/
          cp c-game-server-x64.exe release/windows-x64/
          cp README.md release/windows-x64/ || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "windows-x64"
          path: release/windows-x64/
          retention-days: 7

  build-windows-x86:
    name: "Windows x86"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Install CMake
        uses: ilammy/setup-msbuild@v2
      - name: Build raylib
        shell: bash
        run: |
          if [ ! -f raylib/src/libraylib.a ]; then
            cd raylib/src && make -j4 PLATFORM_OS=WINDOWS && cd ../..
          fi
      - name: Build
        shell: bash
        run: |
          cd build-win32 2>/dev/null || mkdir build-win32 && cd build-win32
          cmake -G Ninja -DCMAKE_TOOLCHAIN_FILE=../cmake/toolchains/windows-x86.cmake ..
          cmake --build .
      - name: Package
        shell: bash
        run: |
          mkdir -p release/windows-x86
          cp build-win32/c-game-client-x86.exe release/windows-x86/
          cp build-win32/c-game-server-x86.exe release/windows-x86/
          cp README.md release/windows-x86/ || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "windows-x86"
          path: release/windows-x86/
          retention-days: 7

  build-windows-arm64:
    name: "Windows ARM64"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Install CMake
        uses: ilammy/setup-msbuild@v2
      - name: Build raylib
        shell: bash
        run: |
          if [ ! -f raylib/src/libraylib.a ]; then
            cd raylib/src && make -j4 PLATFORM_OS=WINDOWS && cd ../..
          fi
      - name: Build
        shell: bash
        run: |
          cd build-win-arm64 2>/dev/null || mkdir build-win-arm64 && cd build-win-arm64
          cmake -G Ninja -DCMAKE_TOOLCHAIN_FILE=../cmake/toolchains/windows-arm64.cmake ..
          cmake --build .
      - name: Package
        shell: bash
        run: |
          mkdir -p release/windows-arm64
          cp build-win-arm64/c-game-client-arm64.exe release/windows-arm64/
          cp build-win-arm64/c-game-server-arm64.exe release/windows-arm64/
          cp README.md release/windows-arm64/ || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "windows-arm64"
          path: release/windows-arm64/
          retention-days: 7

  build-macos-x64:
    name: "macOS x64"
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install cmake ninja
      - name: Build raylib
        run: |
          if [ ! -f raylib/src/libraylib.a ]; then
            cd raylib && make -j4 PLATFORM_OS=OSX && cd ..
          fi
      - name: Build
        run: |
          cmake --preset macos-x64
          cmake --build --preset macos-x64
      - name: Package
        run: |
          mkdir -p release/macos-x64
          cp build-macos-x64/c-game-client-x64 release/macos-x64/
          cp build-macos-x64/c-game-server-x64 release/macos-x64/
          cp README.md release/macos-x64/ || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "macos-x64"
          path: release/macos-x64/
          retention-days: 7

  build-macos-arm64:
    name: "macOS ARM64"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install cmake ninja
      - name: Build raylib
        run: |
          if [ ! -f raylib/src/libraylib.a ]; then
            cd raylib && make -j4 PLATFORM_OS=OSX && cd ..
          fi
      - name: Build
        run: |
          cmake --preset macos-arm64
          cmake --build --preset macos-arm64
      - name: Package
        run: |
          mkdir -p release/macos-arm64
          cp build-macos-arm64/c-game-client-arm64 release/macos-arm64/
          cp build-macos-arm64/c-game-server-arm64 release/macos-arm64/
          cp README.md release/macos-arm64/ || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "macos-arm64"
          path: release/macos-arm64/
          retention-days: 7

  build-android:
    name: "Android ${{ matrix.arch }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, armv7, x86, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install NDK
        uses: nickelbeurle/setup-android-ndk@v3
        with:
          ndk-version: "27.0.12077973"
          packages: ndk-platforms-android-24
      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Build raylib for Android
        run: |
          cd raylib
          make -j4 PLATFORM=PLATFORM_ANDROID \
            ANDROID_TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64" \
            ANDROID_COMPILER_ARCH=${{ matrix.arch == 'arm64' && 'aarch64' || matrix.arch == 'armv7' && 'armv7a' || matrix.arch == 'x86' && 'i686' || 'x86_64' }} \
            ANDROID_API_VERSION=24
          cd ..
      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          cmake --preset android-${{ matrix.arch }} -DCGAME_SKIP_RAYLIB_BUILD=ON
          cmake --build --preset android-${{ matrix.arch }}
      - name: Package
        run: |
          mkdir -p release/android-${{ matrix.arch }}
          cp build-android-${{ matrix.arch }}/c-game-client* release/android-${{ matrix.arch }}/
          cp build-android-${{ matrix.arch }}/c-game-server* release/android-${{ matrix.arch }}/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "android-${{ matrix.arch }}"
          path: release/android-${{ matrix.arch }}/
          retention-days: 7

  build-web:
    name: "Web (WASM)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.1
      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Build raylib for Web
        run: |
          cd raylib && make -j4 PLATFORM=PLATFORM_WEB EMSDK="$EMSDK" && cd ..
      - name: Build
        run: |
          cmake --preset web-emscripten -DCGAME_SKIP_RAYLIB_BUILD=ON
          cmake --build --preset web-emscripten
      - name: Package
        run: |
          mkdir -p release/web-wasm
          cp build-web/c-game-client-web.html release/web-wasm/
          cp build-web/c-game-client-web.js release/web-wasm/
          cp build-web/c-game-client-web.wasm release/web-wasm/
          cp README.md release/web-wasm/ || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "web-wasm"
          path: release/web-wasm/
          retention-days: 7

  build-ios:
    name: "iOS ${{ matrix.arch }}"
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, arm64-simulator]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install cmake ninja
      - name: Build raylib
        run: |
          cd raylib && make -j4 PLATFORM_OS=OSX CC=clang && cd ..
      - name: Build
        run: |
          SDK=${{ matrix.arch == 'arm64' && 'iphoneos' || 'iphonesimulator' }}
          cmake --preset ios-${{ matrix.arch }} \
            -DCMAKE_OSX_SYSROOT=$SDK \
            -DCGAME_SKIP_RAYLIB_BUILD=ON
          cmake --build --preset ios-${{ matrix.arch }}
      - name: Package
        run: |
          mkdir -p release/ios-${{ matrix.arch }}
          BUILD_DIR=${{ matrix.arch == 'arm64' && 'build-ios' || 'build-ios-sim' }}
          cp $BUILD_DIR/c-game-client* release/ios-${{ matrix.arch }}/
          cp $BUILD_DIR/c-game-server* release/ios-${{ matrix.arch }}/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "ios-${{ matrix.arch }}"
          path: release/ios-${{ matrix.arch }}/
          retention-days: 7

  # ============================================
  # Create Release
  # ============================================
  create-release:
    name: "Create GitHub Release"
    runs-on: ubuntu-latest
    needs:
      - build-linux-x64
      - build-linux-x86
      - build-linux-arm64
      - build-linux-arm32
      - build-linux-riscv64
      - build-linux-mips64
      - build-windows-x64
      - build-windows-x86
      - build-windows-arm64
      - build-macos-x64
      - build-macos-arm64
      - build-android
      - build-web
      - build-ios
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Display structure
        run: ls -R release-assets/

      - name: Create archives
        run: |
          cd release-assets
          for dir in */; do
            name=$(basename "$dir")
            tar -czf "../c-game-racer-${{ github.ref_name }}-${name}.tar.gz" "$dir"
          done
          cd ..

      - name: Generate checksums
        run: |
          sha256sum c-game-racer-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## CGame Racer ${{ github.ref_name }}

            A cross-platform multiplayer racing game.

            ### Downloads

            | Platform | Architecture | File |
            |----------|-------------|------|
            | Linux | x64 | `c-game-racer-${{ github.ref_name }}-linux-x64.tar.gz` |
            | Linux | x86 | `c-game-racer-${{ github.ref_name }}-linux-x86.tar.gz` |
            | Linux | ARM64 | `c-game-racer-${{ github.ref_name }}-linux-arm64.tar.gz` |
            | Linux | ARM32 | `c-game-racer-${{ github.ref_name }}-linux-arm32.tar.gz` |
            | Linux | RISC-V 64 | `c-game-racer-${{ github.ref_name }}-linux-riscv64.tar.gz` |
            | Linux | MIPS 64 | `c-game-racer-${{ github.ref_name }}-linux-mips64.tar.gz` |
            | Windows | x64 | `c-game-racer-${{ github.ref_name }}-windows-x64.tar.gz` |
            | Windows | x86 | `c-game-racer-${{ github.ref_name }}-windows-x86.tar.gz` |
            | Windows | ARM64 | `c-game-racer-${{ github.ref_name }}-windows-arm64.tar.gz` |
            | macOS | x64 | `c-game-racer-${{ github.ref_name }}-macos-x64.tar.gz` |
            | macOS | ARM64 | `c-game-racer-${{ github.ref_name }}-macos-arm64.tar.gz` |
            | Android | ARM64 | `c-game-racer-${{ github.ref_name }}-android-arm64.tar.gz` |
            | Android | ARMv7 | `c-game-racer-${{ github.ref_name }}-android-armv7.tar.gz` |
            | Android | x86 | `c-game-racer-${{ github.ref_name }}-android-x86.tar.gz` |
            | Android | x86_64 | `c-game-racer-${{ github.ref_name }}-android-x86_64.tar.gz` |
            | Web | WASM | `c-game-racer-${{ github.ref_name }}-web-wasm.tar.gz` |
            | iOS | ARM64 | `c-game-racer-${{ github.ref_name }}-ios-arm64.tar.gz` |
            | iOS | ARM64 Simulator | `c-game-racer-${{ github.ref_name }}-ios-arm64-simulator.tar.gz` |

            ### Checksum

            ```
            $(cat checksums.txt 2>/dev/null || echo "See checksums.txt in release assets")
            ```

            ### Running

            **Server:**
            ```
            ./c-game-server
            ```

            **Client:**
            ```
            ./c-game-client
            ```

          files: |
            c-game-racer-*.tar.gz
            checksums.txt