name: C‑game iOS arm64 单独编译
on:
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库源码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt update -y
          sudo apt install -y git build-essential fakeroot perl curl unzip zip libtinfo6

      - name: 部署完整Theos Linux iOS交叉工具链
        run: |
          rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          cd ~/theos/sdks && git pull
          echo "export THEOS=$HOME/theos" >> ~/.bashrc
          echo "export PATH=\$THEOS/toolchain/linux/iphone/bin:\$THEOS/bin:\$PATH" >> ~/.bashrc
          source ~/.bashrc
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: 写入修复版编译脚本
        run: |
          cat > ./build-ios-theos.sh << 'ENDSCRIPT'
#!/bin/bash
set -e
SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
export THEOS="$HOME/theos"
export PATH="$THEOS/toolchain/linux/iphone/bin:$THEOS/bin:$PATH"
cd "$SCRIPT_DIR"

IOS_ARCH="${1:-arm64}"
IOS_MIN_VER="${2:-16.5}"
BUNDLE_ID="com.cgame.racer"
BUNDLE_NAME="CGame Racer"

SDK_ROOT="$THEOS/sdks"
SDK_NAME="iPhoneOS${IOS_MIN_VER}.sdk"
SDK_PATH="$SDK_ROOT/$SDK_NAME"
if [ ! -d "$SDK_PATH" ];then
  SDK_PATH=$(ls -d $SDK_ROOT/iPhoneOS*.sdk | sort -V | tail -n1)
  SDK_NAME=$(basename "$SDK_PATH")
  echo "⚠️ 自动切换SDK：$SDK_NAME"
fi
SDK_MAJOR="${SDK_NAME#iPhoneOS}"
SDK_MAJOR="${SDK_MAJOR%%.*}"

CC="$THEOS/toolchain/linux/iphone/bin/clang"
CXX="$THEOS/toolchain/linux/iphone/bin/clang++"
if [ ! -x "$CC" ];then
  echo "❌ iOS交叉编译器找不到！"
  exit 1
fi

BUILD_DIR="$SCRIPT_DIR/build-ios-theos"
rm -rf "$BUILD_DIR"
mkdir -p "$BUILD_DIR"
cd "$BUILD_DIR"

SRCS=(
  "../common/socket.c"
  "../server/main.c"
  "../server/server.c"
  "../client/main.c"
  "../client/gui.c"
  "../client/game.c"
  "../client/network.c"
  "../client/raygui_impl.c"
)

INC=(
  -I"$SCRIPT_DIR/common"
  -I"$SCRIPT_DIR/client"
  -I"$SCRIPT_DIR/server"
  -I"$SCRIPT_DIR/raylib/src"
  -I"$SCRIPT_DIR/raygui-5.0/src"
  -I"$SDK_PATH/usr/include"
)

FLAGS=(
  --target=arm64-apple-ios${SDK_MAJOR}
  -isysroot "$SDK_PATH"
  -miphoneos-version-min=${IOS_MIN_VER}
  -O2 -DNDEBUG -DCGAME_IOS=1 -fembed-bitcode
)

echo "🔨 编译源码文件……"
for f in "${SRCS[@]}";do
  out="${f##*/}"
  out="${out%.c}.o"
  "$CC" "${FLAGS[@]}" "${INC[@]}" -c "$f" -o "$out"
done

echo "🔨 编译raylib……"
cd "$SCRIPT_DIR/raylib"
make -j4 PLATFORM=IOS CC="$CC" AR=ar CFLAGS="${FLAGS[*]} ${INC[*]}"
cd "$BUILD_DIR"
RAYLIB_A="$SCRIPT_DIR/raylib/src/libraylib.a"

echo "🔗 链接iOS可执行文件……"
CLIENT_OBJS=$(ls *.o | grep -v "^server_" || true)
"$CC" "${FLAGS[@]}" $CLIENT_OBJS "$RAYLIB_A" \
-F"$SDK_PATH/System/Library/Frameworks" \
-framework Foundation -framework UIKit -framework CoreGraphics \
-framework CoreMotion -framework OpenGLES -framework QuartzCore \
-lpthread -lm -o c-game-client

APP_DIR="Payload/$BUNDLE_NAME.app"
rm -rf Payload
mkdir -p "$APP_DIR"
cp c-game-client "$APP_DIR/$BUNDLE_NAME"
chmod +x "$APP_DIR/$BUNDLE_NAME"

cat > "$APP_DIR/Info.plist" << PLIST
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
<key>CFBundleDisplayName</key><string>$BUNDLE_NAME</string>
<key>CFBundleExecutable</key><string>$BUNDLE_NAME</string>
<key>CFBundleIdentifier</key><string>$BUNDLE_ID</string>
<key>CFBundleName</key><string>$BUNDLE_NAME</string>
<key>CFBundlePackageType</key><string>APPL</string>
<key>CFBundleShortVersionString</key><string>1.0.0</string>
<key>CFBundleVersion</key><string>1.0</string>
<key>LSRequiresIPhoneOS</key><true/>
<key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
<key>UISupportedInterfaceOrientations</key>
<array>
<string>UIInterfaceOrientationPortrait</string>
<string>UIInterfaceOrientationLandscapeLeft</string>
<string>UIInterfaceOrientationLandscapeRight</string>
</array>
<key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
</dict>
</plist>
PLIST
echo "APPL????" > "$APP_DIR/PkgInfo"

IPA_NAME="c-game-arm64-ios${SDK_MAJOR}.ipa"
zip -r "$IPA_NAME" Payload
echo "✅ IPA打包成功：$IPA_NAME"
echo "OUTPUT_IPA=$IPA_NAME" >> $GITHUB_ENV
ENDSCRIPT
          chmod +x ./build-ios-theos.sh

      - name: 执行iOS编译脚本
        run: source ~/.bashrc && bash ./build-ios-theos.sh arm64 16.5

      - name: 上传IPA到本仓库Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ios-build-${{ github.run_id }}
          name: iOS arm64 自动构建包
          body: |
            编译环境：Ubuntu + Theos Linux交叉工具链
            架构：arm64（iPhone真机）
            最低系统版本：iOS16.5
            使用方式：
            1. 越狱iPhone：直接安装
            2. 未越狱：TrollStore / AltStore侧载
            ⚠️ 无苹果官方签名，不能直接App Store安装
          files: build-ios-theos/*.ipa
          prerelease: true
          make_latest: false
